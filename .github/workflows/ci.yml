name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: make check
      - run: make contract
      - run: make build
      - name: Offline runtime regression (no model API)
        run: make benchmark
      - name: Preserve benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression-${{ matrix.os }}
          path: artifacts/go-benchmark.json
          if-no-files-found: ignore
